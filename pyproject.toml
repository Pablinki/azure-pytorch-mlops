[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "textclf"
version = "0.1.0"
description = "PyTorch text classifier trained on Azure ML and served on Azure Container Apps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "tenacity>=8.3",
]

[project.optional-dependencies]
train = ["datasets>=2.19", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.4", "mlflow>=2.13", "azureml-mlflow"]
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
azure = ["azure-ai-ml>=1.16", "azure-identity>=1.16"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "types-PyYAML"]

[project.scripts]
textclf = "textclf.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "BLE", "TRY"]   # BLE = blind except, TRY = tryceratops
ignore = ["TRY003"]                                           # descriptive messages in raise are wanted here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                                          # asserts are fine in tests

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# --basetemp keeps tmp_path inside the repo (git-ignored): identical behaviour on Windows, Linux and CI,
# and immune to a locked-down %TEMP%\pytest-of-<user> folder.
addopts = "-ra -q --basetemp=.pytest_tmp --cov=textclf --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
